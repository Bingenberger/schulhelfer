<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Admin-Anmeldung – Schulfest-Helfer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="container">
    <div class="center-card">
      <p class="eyebrow">Schulfest-Helfer</p>
      <h2 style="text-align:center; margin-top:0; margin-bottom:1.5rem;">Administration</h2>
      <article>
        {% if error %}
          <p class="error-msg" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="/admin/login">
          <label for="username">Benutzername</label>
          <input type="text" id="username" name="username" required autocomplete="username"
                 value="{{ username | default('') }}" autofocus>

          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">

          <button type="submit" style="width:100%; margin-top:0.5rem;">Anmelden</button>
        </form>
      </article>
      <p class="footnote center"><a href="/">&larr; Zur öffentlichen Ansicht</a></p>
    </div>
  </main>
</body>
</html>
