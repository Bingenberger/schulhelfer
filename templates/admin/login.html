<!DOCTYPE html>
<html lang="de">
<head>
  {% include "partials/head.html" %}
  <title>Admin-Anmeldung – Schulfest-Helfer</title>
</head>
<body class="login-page">
  <main class="container">
    <div class="center-card">
      <div class="login-head">
        <span class="brand-mark brand-mark-lg">{{ icon('confetti', fill=true) }}</span>
        <p class="eyebrow">Schulfest-Helfer</p>
        <h1>Administration</h1>
      </div>
      <article>
        {% if error %}
          <p class="error-msg" role="alert">{{ icon('warning-circle', fill=true) }} {{ error }}</p>
        {% endif %}
        <form method="post" action="/admin/login">
          <label for="username">Benutzername</label>
          <input type="text" id="username" name="username" required autocomplete="username"
                 value="{{ username | default('') }}" autofocus>

          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">

          <button type="submit" class="btn-block">{{ icon('sign-in') }} Anmelden</button>
        </form>
      </article>
      <p class="footnote center"><a href="/">{{ icon('arrow-left') }} Zur öffentlichen Ansicht</a></p>
    </div>
  </main>
</body>
</html>
